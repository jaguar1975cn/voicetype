[project]
name = "voicetype"
version = "0.1.0"
description = "Local push-to-talk dictation for GNOME/Wayland, mixed Chinese and English"
requires-python = ">=3.12,<3.13"
license = "MIT"
readme = "README.md"
dependencies = [
    "faster-whisper>=1.1.0",
    # CTranslate2 dlopen()s these by soname and does not depend on them
    # itself. Without them the first transcription fails with
    # "Library libcublas.so.12 is not found or cannot be loaded".
    "nvidia-cublas-cu12",
    "nvidia-cudnn-cu12==9.*",
]

[project.urls]
Homepage = "https://github.com/jaguar1975cn/voicetype"
Issues = "https://github.com/jaguar1975cn/voicetype/issues"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
voicetype-daemon = "voicetype.daemon:main"
voicetype-toggle = "voicetype.client:main"
voicetype-record-fixture = "voicetype.fixture:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["voicetype"]
